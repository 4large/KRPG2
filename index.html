<!DOCTYPE html>
<html lang="en">

<head>
  <!---Remove this when you want to access game page-->
  <!-- <meta http-equiv="refresh" content="0; url=construction.html" /> -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRPG2</title>
  <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/kirkingitrn.webp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    #preload-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: sans-serif;
      transition: opacity 0.4s ease;
    }

    #preload-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #preload-title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    #preload-bar-track {
      width: min(70vw, 400px);
      height: 18px;
      background: #222;
      border: 2px solid #555;
      border-radius: 9px;
      overflow: hidden;
    }

    #preload-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.15s ease-out;
    }

    #preload-status {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div id="preload-screen">
    <div id="preload-title">Loading KRPG2...</div>
    <div id="preload-bar-track">
      <div id="preload-bar-fill"></div>
    </div>
    <div id="preload-status">0 / 0 assets loaded</div>
  </div>

  <header>
    <h1>I've been kidnapped by the russian government</h1>
  </header>

  <!--Note for ads, you may want to render them using an iframe, perhaps in main? or using a new div for the ads iframe-->
  <main>
    <div id="magacock" style="position: relative;">
      <canvas id="gameCanvas"></canvas>
      <p id="dialogue-box" style="position: absolute; bottom: 0px; opacity: 0;">Welcome to KRPG2!</p>
      <div id="choice-sidebar" style="display: none;"></div>
    </div>
    <button id="startbtn" type="button">Start</button>
  </main>

  <footer id="footer">
    <p id="feet" style="opacity: 0;">Balance: 5000</p>
  </footer>

  <script type="module" src="preload.js"></script>
  <script type="module" src="game.js"></script>
</body>

</html>
